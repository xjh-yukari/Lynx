name: lynx-document-rag
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes: ["etcd-data:/etcd"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: milvusdb/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: ${LYNX_MINIO_USER:?set LYNX_MINIO_USER}
      MINIO_SECRET_KEY: ${LYNX_MINIO_PASSWORD:?set LYNX_MINIO_PASSWORD}
    command: minio server /minio_data
    volumes: ["minio-data:/minio_data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
  milvus:
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: ${LYNX_MINIO_USER:?set LYNX_MINIO_USER}
      MINIO_SECRET_ACCESS_KEY: ${LYNX_MINIO_PASSWORD:?set LYNX_MINIO_PASSWORD}
    volumes: ["milvus-data:/var/lib/milvus"]
    ports: ["127.0.0.1:19540:19530", "127.0.0.1:19091:9091"]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      timeout: 5s
      retries: 15
volumes:
  etcd-data:
  minio-data:
  milvus-data:
