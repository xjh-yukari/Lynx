[project]
name = "lynx-document-rag"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mcp==2.3.0", "uvicorn==0.54.0", "pydantic==2.14.0",
  "pymilvus==2.5.11", "pymilvus-model==0.3.2",
  "numpy==1.26.4", "scipy==1.15.3", "torch==2.6.0",
  "transformers==4.51.3", "FlagEmbedding==1.3.5",
  "sentence-transformers==4.1.0", "huggingface-hub==0.36.0",
  "peft==0.15.2", "accelerate==1.6.0",
  "datasets==3.5.0", "pyarrow==19.0.1", "pandas==2.2.3",
  "pypdf==6.1.1", "setuptools==80.9.0",
]

[project.scripts]
rag-build = "document_rag.cli:main"
rag-serve = "document_rag.server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_rag"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
