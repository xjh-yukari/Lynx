# 上下文管理：事实位置（10%/50%/90%）× 对齐窗口（32k/64k/128k）的热力图。
# 标签 position:N 与 window:N 供报告绘制热力图；窗口用 align_context_window 显式指定。
cases:
  - id: context.position.pos10.w32k
    suite: context
    track: shared
    requires: [multi_turn]
    align_context_window: 32768
    description: 事实埋在上下文前 10%，总长约 32k。
    tags: ["position:10", "window:32768"]
    facts: { code: { kind: code } }
    steps:
      - session: new
        user: "请记住项目代号 {code}。"
      - filler: { tokens: 20000, turns: 4, topic: 部署日志 }
      - user: "项目代号是什么？只回答代号。"
        grade: [{ type: contains, value: "{code}" }]
    metrics: [context.position_recall]

