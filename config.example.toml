# call_timeout = 20
# shutdown_timeout = 10

[model_presets.long_answer]
provider = "deepseek"
name = "deepseek-flash"
# 示例值，启用前需核实 API 是否支持此输出长度。
max_tokens = 12288
context_window_tokens = 65536
