# token_env = "RAG_MCP_TOKEN"
# allowed_tools = ["search_knowledge"]
# read_only_tools = ["search_knowledge"]
# call_timeout = 120

# 本地 MCP 示例：默认关闭。启用前填写实际程序、服务脚本和工作目录。
# 修改后重启 Agent；这里的服务仅做加法测试，不会保存长期记忆。
# [mcp.servers.demo]
# enabled = false
# command = 'E:\github\nanobot\.venv\Scripts\python.exe'
# args = ['E:\github\nanobot\tests\mcp\fixture_server.py']
# cwd = 'E:\github\nanobot'
# allowed_tools = ['add']
# read_only_tools = ['add']
# allow_write = false
