[project]
name = "lynx-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5,<4",
    "beautifulsoup4>=4.15.0,<5",
    "markdown-it-py>=4.2.0",
    "jsonschema>=4.26.0,<5",
    "mcp>=2.3.0,<3",
    "openai>=3.31.0",
    "prompt-toolkit>=3.0.53",
    "pygments>=2.19,<3",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "referencing>=0.37.0,<1",
]

[project.scripts]
lynx-agent = "lynx_agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    # 评测框架：独立包（bench/），只在开发与评测时安装，不进入 Lynx 运行时依赖。
    "agent-bench",
]

[tool.uv.workspace]
members = ["bench"]

[tool.uv.sources]
agent-bench = { workspace = true }
